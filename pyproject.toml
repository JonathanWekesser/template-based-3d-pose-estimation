[project]
name = "template-based-3d-pose-estimation"
version = "0.1.0"
description = "Bachelor Thesis with the Title: Schätzung der initialen Pose eines Objekts in einer 3D-Punktwolke"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "ipywidgets>=8.1.7",
    "jupyterlab==4.5.0a1",
    "open3d>=0.19.0",
    "opencv-python>=4.11.0.86",
    "optuna>=4.5.0",
    "pyrealsense2>=2.56.5.9235",
    "seaborn==0.13.2",
    "simpleicp>=2.0.15",
    "ultralytics==8.3.146",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
